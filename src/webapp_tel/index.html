<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://telegram.org; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; connect-src 'none'; frame-ancestors https://web.telegram.org https://*.telegram.org; base-uri 'none'; form-action 'none';" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; padding:16px; }
    .card { max-width:460px; margin:4vh auto; padding:16px; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.08); background:var(--bg,#fff); }
    .row { margin-bottom:12px; display:flex; flex-direction:column; }
    label { font-size:14px; margin-bottom:6px; color:#111; }
    input { padding:10px; border:1px solid #ddd; border-radius:8px; font-size:16px; background:#fff; color:#111; }
    button { width:100%; padding:12px; border:0; border-radius:10px; font-size:16px; cursor:pointer; }
    .muted { font-size:12px; color:#777; margin-top:8px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Регистрация</h2>

    <div id="fallback" class="hidden">
      <p>Эту форму нужно открыть из Telegram-бота.</p>
      <p><a id="deeplink" href="https://t.me/<your_bot_username>?start=register">Открыть бота</a></p>
    </div>

    <form id="form">
      <div class="row">
        <label for="first_name">Фамилия</label>
        <input id="first_name" required />
      </div>
      <div class="row">
        <label for="last_name">Имя</label>
        <input id="last_name" required />
      </div>
      <div class="row">
        <label for="phone">Телефон</label>
        <input id="phone" type="tel" placeholder="+7 999 123-45-67" />
      </div>
      <div class="row">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </div>

      <input id="username" type="hidden" />
      <input id="nonce" type="hidden" />
      <button id="submit" type="submit">Отправить</button>
      <p class="muted">Данные отправляются в чат-бота, без запросов к API.</p>
    </form>
  </div>

  <!-- Разрешён CDN Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- ВЕСЬ твой код в отдельном файле на том же домене -->
  <script src="/register/app.js"></script>
</body>
</html>
